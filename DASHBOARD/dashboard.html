<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DEEPTRACK — Mine Rescue Rover Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  :root{
    --bg:#0c1210;
    --panel:#131a17;
    --panel-2:#0f1512;
    --line:#25332c;
    --line-soft:#1a231e;
    --text:#e7ece8;
    --text-dim:#8ea295;
    --amber:#e8a33d;
    --amber-dim:#6b5527;
    --green:#4cc27a;
    --green-dim:#204d34;
    --red:#e0554a;
    --red-dim:#5c221d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Bebas Neue',sans-serif;letter-spacing:0.06em;}

  .wrap{display:flex;flex-direction:column;height:100vh;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#141c19,#0f1512);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{width:12px;height:12px;background:var(--amber);
    box-shadow:0 0 10px var(--amber);transform:rotate(45deg);}
  .brand h1{font-size:26px;margin:0;color:var(--text);}
  .brand small{display:block;font-size:11px;color:var(--text-dim);
    letter-spacing:0.12em;text-transform:uppercase;margin-top:-4px;}

  .conn{display:flex;align-items:center;gap:14px;}
  .btn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    letter-spacing:0.05em;text-transform:uppercase;color:var(--text);
    background:var(--panel-2);border:1px solid var(--line);padding:9px 16px;
    cursor:pointer;transition:border-color .15s,color .15s;
  }
  .btn:hover{border-color:var(--amber);color:var(--amber);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn.danger-btn:hover{border-color:var(--red);color:var(--red);}
  .btn.mqtt-btn{border-color:var(--amber-dim);}
  .btn.mqtt-btn:hover{border-color:var(--amber);color:var(--amber);}
  .btn.gw-btn{border-color:var(--green-dim);}
  .btn.gw-btn:hover{border-color:var(--green);color:var(--green);}

  .pill{display:flex;align-items:center;gap:7px;font-size:11px;
    text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);}
  .dot.live{background:var(--green);box-shadow:0 0 8px var(--green);}
  .dot.off{background:#4a4a4a;}

  main{flex:1;display:grid;grid-template-columns:1fr 320px;gap:1px;
    background:var(--line);overflow:hidden;}

  .map-panel{background:var(--panel);position:relative;display:flex;flex-direction:column;}
  .map-head{display:flex;justify-content:space-between;align-items:baseline;
    padding:14px 18px 0 18px;}
  .map-head h2{font-size:22px;margin:0;color:var(--amber);}
  .map-head span{font-size:11px;color:var(--text-dim);}
  #mapCanvas{flex:1;width:100%;display:block;}

  .state-badge{
    position:absolute;top:16px;right:18px;padding:6px 14px;
    font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
    border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);
  }
  .state-badge.NORMAL{color:var(--green);border-color:var(--green-dim);}
  .state-badge.SLOW{color:var(--amber);border-color:var(--amber-dim);}
  .state-badge.AVOIDING{color:var(--amber);border-color:var(--amber-dim);background:#241c0d;}
  .state-badge.DANGER{color:var(--red);border-color:var(--red);background:#2a1210;
    animation:pulse 0.9s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(224,85,74,0);}50%{box-shadow:0 0 14px rgba(224,85,74,0.55);}}

  .side{background:var(--panel);display:flex;flex-direction:column;overflow-y:auto;}
  .sec{padding:16px 18px;border-bottom:1px solid var(--line-soft);}
  .sec h3{margin:0 0 12px 0;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--text-dim);font-weight:600;}

  .indicators{display:flex;gap:10px;}
  .led{flex:1;text-align:center;padding:10px 0;border:1px solid var(--line);background:var(--panel-2);}
  .led .lamp{width:16px;height:16px;border-radius:50%;margin:0 auto 8px auto;
    background:#2a332e;}
  .led.on-red .lamp{background:var(--red);box-shadow:0 0 12px var(--red);}
  .led.on-green .lamp{background:var(--green);box-shadow:0 0 12px var(--green);}
  .led label{font-size:10px;letter-spacing:0.08em;color:var(--text-dim);text-transform:uppercase;}
  .buzz{margin-top:10px;text-align:center;font-size:11px;letter-spacing:0.1em;
    color:var(--text-dim);padding:8px;border:1px dashed var(--line);}
  .buzz.active{color:var(--red);border-color:var(--red);animation:pulse 0.6s infinite;}

  .gauge{margin-bottom:14px;}
  .gauge:last-child{margin-bottom:0;}
  .gauge-top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px;}
  .gauge-top .name{color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;}
  .gauge-top .val{color:var(--text);font-weight:600;}
  .gauge-top .val.hot{color:var(--red);}
  .bar{position:relative;height:8px;background:var(--panel-2);border:1px solid var(--line);}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--green);transition:width .25s;}
  .bar .fill.hot{background:var(--red);}
  .bar .thresh{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--amber);}

  .stat-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;
    border-bottom:1px solid var(--line-soft);color:var(--text-dim);}
  .stat-row b{color:var(--text);font-weight:600;}

  .log{flex:1;overflow-y:auto;padding:10px 18px;font-size:11px;}
  .log-entry{padding:5px 0;border-bottom:1px solid var(--line-soft);color:var(--text-dim);}
  .log-entry b{color:var(--red);}
  .log-entry.info b{color:var(--amber);}

  .empty-hint{color:var(--text-dim);font-size:12px;text-align:center;
    margin-top:40px;line-height:1.6;}
  .empty-hint code{color:var(--amber);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1 class="display">DEEPTRACK</h1>
        <small>Mine Rescue Rover — Live Console</small>
      </div>
    </div>
    <div class="conn">
      <div class="pill"><span class="dot off" id="connDot"></span><span id="connLabel">Offline</span></div>
      <button class="btn mqtt-btn" id="mqttBtn">Connect MQTT</button>
      <button class="btn gw-btn" id="connectBtn">Connect Serial</button>
      <button class="btn" id="demoBtn">Demo Mode</button>
      <button class="btn danger-btn" id="resetBtn">Reset Path</button>
    </div>
  </header>

  <main>
    <div class="map-panel">
      <div class="map-head">
        <h2 class="display">Path Trace</h2>
        <span id="mapSubtitle">dead-reckoned · cm</span>
      </div>
      <div class="state-badge NORMAL" id="stateBadge">—</div>
      <canvas id="mapCanvas"></canvas>
    </div>

    <div class="side">
      <div class="sec">
        <h3>Status</h3>
        <div class="indicators">
          <div class="led on-green" id="ledGreen"><div class="lamp"></div><label>Normal</label></div>
          <div class="led" id="ledRed"><div class="lamp"></div><label>Danger</label></div>
        </div>
        <div class="buzz" id="buzzBox">Buzzer silent</div>
      </div>

      <div class="sec">
        <h3>Environment</h3>
        <div class="gauge"><div class="gauge-top"><span class="name">Temperature</span><span class="val" id="v-temp">— °C</span></div>
          <div class="bar"><div class="fill" id="b-temp"></div><div class="thresh" style="left:83%"></div></div></div>
        <div class="gauge"><div class="gauge-top"><span class="name">Humidity</span><span class="val" id="v-hum">— %</span></div>
          <div class="bar"><div class="fill" id="b-hum"></div><div class="thresh" style="left:85%"></div></div></div>
        <div class="gauge"><div class="gauge-top"><span class="name">Methane / CH4 (MQ-4)</span><span class="val" id="v-gas">—</span></div>
          <div class="bar"><div class="fill" id="b-gas"></div><div class="thresh" style="left:44%"></div></div></div>
        <div class="gauge"><div class="gauge-top"><span class="name">Water</span><span class="val" id="v-water">—</span></div>
          <div class="bar"><div class="fill" id="b-water"></div><div class="thresh" style="left:61%"></div></div></div>
        <div class="gauge"><div class="gauge-top"><span class="name">Tilt</span><span class="val" id="v-tilt">— °</span></div>
          <div class="bar"><div class="fill" id="b-tilt"></div><div class="thresh" style="left:67%"></div></div></div>
      </div>

      <div class="sec">
        <h3>Navigation</h3>
        <div class="stat-row"><span>Front distance</span><b id="s-front">—</b></div>
        <div class="stat-row"><span>Position (x, y)</span><b id="s-pos">—</b></div>
        <div class="stat-row"><span>Heading</span><b id="s-heading">—</b></div>
        <div class="stat-row"><span>Encoders L / R</span><b id="s-enc">—</b></div>
        <div class="stat-row"><span>Distance traveled</span><b id="s-dist">0 cm</b></div>
      </div>

      <div class="sec" style="flex:1;display:flex;flex-direction:column;min-height:120px;">
        <h3>Event Log</h3>
        <div class="log" id="logBox"></div>
      </div>
    </div>
  </main>
</div>

<script>
const THRESH = { temp: 50, hum: 85, gas: 1800, water: 2500, tilt: 40 };
const MAXV   = { temp: 60, hum: 100, gas: 4095, water: 4095, tilt: 60 };

// State → path color mapping
const STATE_COLORS = {
  NORMAL:   '#4cc27a',
  SLOW:     '#e8a33d',
  AVOIDING: '#d4912e',
  DANGER:   '#e0554a'
};

let port, reader, keepReading = false;
let trail = [];       // {x, y, heading, state, danger}
let hazards = [];     // {x, y, cause}
let latest = null;
let wasDanger = false;
let totalDistCm = 0;  // cumulative distance

const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas(){
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height - 46;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function log(msg, cls=''){
  const box = document.getElementById('logBox');
  const t = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = 'log-entry ' + cls;
  div.innerHTML = `<b>${t}</b> — ${msg}`;
  box.prepend(div);
  while(box.children.length > 60) box.removeChild(box.lastChild);
}

function setGauge(key, value, unit, decimals=0){
  const pct = Math.max(0, Math.min(100, (value / MAXV[key]) * 100));
  const hot = value >= THRESH[key];
  document.getElementById('v-'+key).textContent = value.toFixed(decimals) + ' ' + unit;
  document.getElementById('v-'+key).classList.toggle('hot', hot);
  const fill = document.getElementById('b-'+key);
  fill.style.width = pct + '%';
  fill.classList.toggle('hot', hot);
}

function drawMap(){
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#0f1512';
  ctx.fillRect(0,0,w,h);

  if (trail.length === 0){
    ctx.fillStyle = '#8ea295';
    ctx.font = '12px IBM Plex Mono';
    ctx.textAlign = 'center';
    ctx.fillText('waiting for telemetry…', w/2, h/2);
    return;
  }

  // fit bounds with padding
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  trail.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);
                    minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});
  const padCm = 40;
  minX-=padCm; maxX+=padCm; minY-=padCm; maxY+=padCm;
  const spanX = Math.max(maxX-minX, 80), spanY = Math.max(maxY-minY, 80);
  const scale = Math.min(w/spanX, h/spanY);
  const ox = w/2 - ((minX+maxX)/2)*scale;
  const oy = h/2 + ((minY+maxY)/2)*scale; // y flipped for screen coords

  const toScreen = (x,y) => [ox + x*scale, oy - y*scale];

  // grid, every 50cm
  ctx.strokeStyle = '#1a231e';
  ctx.lineWidth = 1;
  const gridStep = 50;
  for(let gx = Math.floor(minX/gridStep)*gridStep; gx < maxX; gx += gridStep){
    const [sx] = toScreen(gx, 0);
    ctx.beginPath(); ctx.moveTo(sx,0); ctx.lineTo(sx,h); ctx.stroke();
  }
  for(let gy = Math.floor(minY/gridStep)*gridStep; gy < maxY; gy += gridStep){
    const [,sy] = toScreen(0, gy);
    ctx.beginPath(); ctx.moveTo(0,sy); ctx.lineTo(w,sy); ctx.stroke();
  }

  // trail line — color-coded by rover state
  ctx.lineWidth = 2.5;
  for (let i = 1; i < trail.length; i++){
    const p0 = trail[i-1], p1 = trail[i];
    const [x0,y0] = toScreen(p0.x, p0.y);
    const [x1,y1] = toScreen(p1.x, p1.y);
    ctx.strokeStyle = STATE_COLORS[p1.state] || '#e8a33d';
    ctx.beginPath();
    ctx.moveTo(x0,y0);
    ctx.lineTo(x1,y1);
    ctx.stroke();
  }

  // direction arrows along the path every 25 points
  for (let i = 25; i < trail.length; i += 25){
    const p = trail[i];
    const [ax, ay] = toScreen(p.x, p.y);
    const rad = (p.heading||0) * Math.PI/180;
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(-rad);
    ctx.fillStyle = 'rgba(142,162,149,0.6)';
    ctx.beginPath();
    ctx.moveTo(5,0); ctx.lineTo(-3,3); ctx.lineTo(-3,-3); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // start marker
  const [sx0,sy0] = toScreen(trail[0].x, trail[0].y);
  ctx.fillStyle = '#4cc27a';
  ctx.beginPath(); ctx.arc(sx0,sy0,5,0,7); ctx.fill();
  ctx.font = '10px IBM Plex Mono';
  ctx.fillStyle = '#4cc27a';
  ctx.textAlign = 'left';
  ctx.fillText('START', sx0+8, sy0+3);

  // hazard flags
  hazards.forEach(hz=>{
    const [hx,hy] = toScreen(hz.x, hz.y);
    ctx.fillStyle = '#e0554a';
    ctx.beginPath(); ctx.arc(hx,hy,5,0,7); ctx.fill();
    ctx.font = '10px IBM Plex Mono';
    ctx.fillStyle = '#e0554a';
    ctx.textAlign = 'left';
    ctx.fillText(hz.cause, hx+8, hy+3);
  });

  // rover marker + heading arrow
  const last = trail[trail.length-1];
  const [rx,ry] = toScreen(last.x, last.y);
  const rad = (last.heading||0) * Math.PI/180;
  ctx.save();
  ctx.translate(rx,ry);
  ctx.rotate(-rad);
  ctx.fillStyle = last.danger ? '#e0554a' : '#e8a33d';
  ctx.beginPath();
  ctx.moveTo(12,0); ctx.lineTo(-7,7); ctx.lineTo(-4,0); ctx.lineTo(-7,-7); ctx.closePath();
  ctx.fill();
  ctx.restore();

  // legend
  ctx.font = '10px IBM Plex Mono';
  ctx.textAlign = 'left';
  const legend = [['NORMAL','#4cc27a'],['SLOW','#e8a33d'],['AVOIDING','#d4912e'],['DANGER','#e0554a']];
  legend.forEach(([label,color],i) => {
    const lx = 14, ly = h - 14 - (legend.length - 1 - i) * 16;
    ctx.fillStyle = color;
    ctx.fillRect(lx, ly - 6, 10, 10);
    ctx.fillStyle = '#8ea295';
    ctx.fillText(label, lx + 14, ly + 3);
  });
}

function handleTelemetry(raw){
  // Normalize short & long keys
  const d = {
    tempC: raw.t ?? raw.tempC,
    hum: raw.h ?? raw.hum,
    gas: raw.gas,
    frontCm: raw.dist ?? raw.frontCm,
    water: raw.water,
    tiltDeg: raw.tilt ?? raw.tiltDeg,
    x: raw.x ?? 0,
    y: raw.y ?? 0,
    heading: raw.hd ?? raw.heading ?? 0,
    state: raw.st ?? raw.state ?? 'NORMAL',
    dangerCause: raw.danger ?? raw.dangerCause ?? 'NONE',
    encL: raw.encL,
    encR: raw.encR
  };
  latest = d;

  const danger = d.state === 'DANGER';
  document.getElementById('ledGreen').classList.toggle('on-green', !danger);
  document.getElementById('ledRed').classList.toggle('on-red', danger);
  const buzz = document.getElementById('buzzBox');
  buzz.textContent = danger ? `BUZZER — ${d.dangerCause}` : 'Buzzer silent';
  buzz.classList.toggle('active', danger);

  const badge = document.getElementById('stateBadge');
  badge.textContent = d.state;
  badge.className = 'state-badge ' + d.state;

  if (typeof d.tempC === 'number' && d.tempC > -900) setGauge('temp', d.tempC, '°C', 1);
  if (typeof d.hum === 'number' && d.hum > -900) setGauge('hum', d.hum, '%', 1);
  if (typeof d.gas === 'number') setGauge('gas', d.gas, '', 0);
  if (typeof d.water === 'number') setGauge('water', d.water, '', 0);
  if (typeof d.tiltDeg === 'number') setGauge('tilt', d.tiltDeg, '°', 1);

  document.getElementById('s-front').textContent = (d.frontCm ?? '—') + ' cm';
  document.getElementById('s-pos').textContent = `${(d.x??0).toFixed(1)}, ${(d.y??0).toFixed(1)} cm`;
  document.getElementById('s-heading').textContent = (d.heading ?? 0).toFixed(1) + '°';
  document.getElementById('s-enc').textContent = `${d.encL ?? '—'} / ${d.encR ?? '—'}`;

  if (typeof d.x === 'number' && typeof d.y === 'number'){
    const prev = trail.length > 0 ? trail[trail.length - 1] : null;
    const moved = !prev || Math.abs(d.x - prev.x) > 0.05 || Math.abs(d.y - prev.y) > 0.05
                        || Math.abs((d.heading||0) - (prev.heading||0)) > 0.5;
    if (moved) {
      if (prev) {
        const dx = d.x - prev.x, dy = d.y - prev.y;
        totalDistCm += Math.sqrt(dx*dx + dy*dy);
      }
      trail.push({x:d.x, y:d.y, heading:d.heading||0, danger, state: d.state||'NORMAL'});
      if (trail.length > 4000) trail.shift();
    }
    document.getElementById('s-dist').textContent =
      totalDistCm < 100 ? totalDistCm.toFixed(0) + ' cm'
                        : (totalDistCm / 100).toFixed(2) + ' m';
  }

  if (danger && !wasDanger){
    log(`DANGER — ${d.dangerCause}`, '');
    if (typeof d.x === 'number') hazards.push({x:d.x, y:d.y, cause:d.dangerCause});
  }
  if (!danger && wasDanger){
    log('Cleared, resuming', 'info');
  }
  wasDanger = danger;

  drawMap();
}

// ---------- Hot-Pluggable MQTT over WebSocket ----------
let mqttConn = null;
const MQTT_TOPIC = 'deeptrack/rover/telemetry';
const MQTT_WS_URL = 'wss://broker.hivemq.com:8884/mqtt';

function connectMQTT(){
  if (mqttConn && mqttConn.connected){
    disconnectMQTT();
    return;
  }
  log('Connecting to HiveMQ broker…', 'info');
  try {
    mqttConn = mqtt.connect(MQTT_WS_URL, {
      clientId: 'deeptrack-dash-' + Math.random().toString(16).slice(2,8),
      clean: true,
      connectTimeout: 8000,
      reconnectPeriod: 5000
    });

    mqttConn.on('connect', () => {
      document.getElementById('connDot').className = 'dot live';
      document.getElementById('connLabel').textContent = 'MQTT Live';
      document.getElementById('mqttBtn').textContent = 'Disconnect MQTT';
      document.getElementById('connectBtn').disabled = true;
      document.getElementById('demoBtn').disabled = true;
      log('MQTT connected — subscribed to ' + MQTT_TOPIC, 'info');
      mqttConn.subscribe(MQTT_TOPIC);
    });

    mqttConn.on('message', (topic, payload) => {
      try {
        const d = JSON.parse(payload.toString());
        handleTelemetry(d);
      } catch(e) { /* ignore partial */ }
    });

    mqttConn.on('error', (err) => {
      log('MQTT error: ' + err.message, '');
    });

    mqttConn.on('close', () => {
      document.getElementById('connDot').className = 'dot off';
      document.getElementById('connLabel').textContent = 'Offline';
      document.getElementById('mqttBtn').textContent = 'Connect MQTT';
      document.getElementById('connectBtn').disabled = false;
      document.getElementById('demoBtn').disabled = false;
    });

  } catch(err) {
    log('MQTT connection failed: ' + err.message, '');
  }
}

function disconnectMQTT(){
  if (mqttConn) {
    mqttConn.end(true);
    mqttConn = null;
  }
  document.getElementById('connDot').className = 'dot off';
  document.getElementById('connLabel').textContent = 'Offline';
  document.getElementById('mqttBtn').textContent = 'Connect MQTT';
  document.getElementById('connectBtn').disabled = false;
  document.getElementById('demoBtn').disabled = false;
  log('MQTT disconnected.', 'info');
}

document.getElementById('mqttBtn').addEventListener('click', connectMQTT);

// ---------- Web Serial — connect to Gateway USB ----------
async function connect(){
  if (!('serial' in navigator)){
    log('Web Serial not supported — use Chrome or Edge on desktop.', '');
    alert('Web Serial API is not available in this browser. Please use Chrome or Edge on desktop, connected over HTTPS or localhost.');
    return;
  }
  try{
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    keepReading = true;
    document.getElementById('connDot').className = 'dot live';
    document.getElementById('connLabel').textContent = 'Serial Live';
    document.getElementById('connectBtn').textContent = 'Disconnect';
    document.getElementById('mqttBtn').disabled = true;
    document.getElementById('demoBtn').disabled = true;
    log('Gateway serial link established.', 'info');
    readLoop();
  }catch(err){
    log('Connection failed: ' + err.message);
  }
}

async function disconnect(){
  keepReading = false;
  try{ if(reader) await reader.cancel(); }catch(e){}
  try{ if(port) await port.close(); }catch(e){}
  document.getElementById('connDot').className = 'dot off';
  document.getElementById('connLabel').textContent = 'Offline';
  document.getElementById('connectBtn').textContent = 'Connect Serial';
  document.getElementById('mqttBtn').disabled = false;
  document.getElementById('demoBtn').disabled = false;
  log('Disconnected.', 'info');
}

async function readLoop(){
  const textDecoder = new TextDecoderStream();
  const readableClosed = port.readable.pipeTo(textDecoder.writable);
  reader = textDecoder.readable.getReader();
  let buffer = '';

  try{
    while(keepReading){
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      let idx;
      while((idx = buffer.indexOf('\n')) >= 0){
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx+1);
        if (!line.startsWith('{')) continue;
        try{
          const d = JSON.parse(line);
          handleTelemetry(d);
        }catch(e){ /* partial/garbled line, skip */ }
      }
    }
  }catch(e){
    log('Read error: ' + e.message);
  }finally{
    reader.releaseLock();
  }
}

document.getElementById('connectBtn').addEventListener('click', () => {
  if (keepReading) disconnect(); else connect();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  trail = []; hazards = []; totalDistCm = 0;
  document.getElementById('s-dist').textContent = '0 cm';
  drawMap();
  log('Path cleared.', 'info');
});

// ---------- Demo mode: synthetic telemetry ----------
let demoRunning = false, demoTimer = null;
let demoX=0, demoY=0, demoHeading=0, demoT=0;

function demoTick(){
  demoT += 1;
  const avoiding = (demoT % 30 >= 25 && demoT % 30 <= 29);
  const danger   = (demoT % 55 === 0);

  if (avoiding && demoT % 30 === 25) {
    demoHeading += (Math.random() > 0.5 ? 1 : -1) * (40 + Math.random() * 30);
  } else if (!avoiding && !danger) {
    demoHeading += (Math.random()-0.5) * 8;
  }

  const step = danger ? -2 : (avoiding ? 1 : 4);
  demoX += step * Math.cos(demoHeading*Math.PI/180);
  demoY += step * Math.sin(demoHeading*Math.PI/180);

  const causes = ['GAS','TEMP','HUMIDITY','WATER','TRAPPED'];
  const demoState = danger ? 'DANGER' : (avoiding ? 'AVOIDING' : (demoT % 20 < 3 ? 'SLOW' : 'NORMAL'));

  handleTelemetry({
    tempC: 28 + Math.sin(demoT/10)*4 + (danger?20:0),
    hum: 60 + Math.sin(demoT/14)*10 + (danger?15:0),
    gas: 400 + Math.abs(Math.sin(demoT/8))*300 + (danger?1500:0),
    water: 300 + Math.abs(Math.cos(demoT/9))*200 + (danger?2400:0),
    tiltDeg: 5 + Math.abs(Math.sin(demoT/6))*10,
    frontCm: (20 + Math.abs(Math.sin(demoT/5))*60).toFixed(1),
    encL: demoT*3, encR: demoT*3,
    x: demoX, y: demoY, heading: demoHeading,
    state: demoState,
    dangerCause: danger ? causes[Math.floor(Math.random()*causes.length)] : 'NONE'
  });
}

document.getElementById('demoBtn').addEventListener('click', () => {
  demoRunning = !demoRunning;
  const btn = document.getElementById('demoBtn');
  document.getElementById('connectBtn').disabled = demoRunning;
  document.getElementById('mqttBtn').disabled = demoRunning;
  if (demoRunning){
    btn.textContent = 'Stop Demo';
    document.getElementById('connDot').className = 'dot live';
    document.getElementById('connLabel').textContent = 'Demo';
    log('Demo mode started — synthetic telemetry.', 'info');
    demoTimer = setInterval(demoTick, 400);
  } else {
    btn.textContent = 'Demo Mode';
    clearInterval(demoTimer);
    document.getElementById('connDot').className = 'dot off';
    document.getElementById('connLabel').textContent = 'Offline';
    log('Demo mode stopped.', 'info');
  }
});

drawMap();
