<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rover Dashboard</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; }
        .danger { color: #ff4444; font-weight: bold; }
        canvas { background: #000; border: 1px solid #333; border-radius: 4px; width: 100%; max-width: 400px; height: 400px; }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 200px; margin-top: 20px; }
        button { padding: 10px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:active { background: #555; }
    </style>
</head>
<body>
    <h1>Mine Rescue Rover Dashboard</h1>
    
    <div class="grid">
        <div class="card">
            <h2>Telemetry</h2>
            <div id="status">Connecting...</div>
            <p>Temp: <span id="temp">--</span> °C</p>
            <p>Humidity: <span id="hum">--</span> %</p>
            <p>Gas (MQ4): <span id="gas">--</span></p>
            <p>Water Level: <span id="water">--</span></p>
            <p>Pitch/Roll: <span id="pitch">--</span> / <span id="roll">--</span></p>
            <p>Status: <span id="danger">SAFE</span></p>
        </div>
        
        <div class="card">
            <h2>Live Local 2D Scan</h2>
            <canvas id="radarCanvas" width="400" height="400"></canvas>
            
            <h2>Controls</h2>
            <div class="controls">
                <div></div><button onmousedown="sendCmd(255, 255)" onmouseup="sendCmd(0, 0)">FWD</button><div></div>
                <button onmousedown="sendCmd(-200, 200)" onmouseup="sendCmd(0, 0)">LEFT</button>
                <button onmousedown="sendCmd(-255, -255)" onmouseup="sendCmd(0, 0)">REV</button>
                <button onmousedown="sendCmd(200, -200)" onmouseup="sendCmd(0, 0)">RIGHT</button>
            </div>
            <p style="font-size: 0.8em; color: #888; margin-top: 10px;">Requires Serial connection for controls.</p>
            <button onclick="connectSerial()" id="serialBtn" style="background: #0066cc;">Connect Serial</button>
        </div>
    </div>

    <script>
        // MQTT Setup
        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
        client.on('connect', () => {
            document.getElementById('status').innerText = 'Connected (MQTT)';
            client.subscribe('rover/telemetry');
            client.subscribe('rover/scan');
        });

        // Radar Canvas Setup
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const scanPoints = []; // {x, y, ts}
        const MAX_POINTS = 200;
        const SCALE = 0.25; // 400px / (800mm * 2) = 0.25
        
        function drawRadar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            ctx.arc(200, 380, 100, 0, Math.PI, true);
            ctx.arc(200, 380, 200, 0, Math.PI, true);
            ctx.stroke();
            
            // Draw rover
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(195, 375, 10, 10);
            
            // Draw points
            const now = Date.now();
            for (let i = scanPoints.length - 1; i >= 0; i--) {
                const pt = scanPoints[i];
                const age = now - pt.ts;
                if (age > 5000) {
                    scanPoints.splice(i, 1);
                    continue;
                }
                
                const alpha = 1.0 - (age / 5000);
                ctx.fillStyle = `rgba(0, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            requestAnimationFrame(drawRadar);
        }
        drawRadar();

        // Data Handling
        client.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                if (topic === 'rover/telemetry') {
                    document.getElementById('temp').innerText = data.t;
                    document.getElementById('hum').innerText = data.h;
                    document.getElementById('gas').innerText = data.gas;
                    document.getElementById('water').innerText = data.water;
                    
                    const pitch = Math.atan2(-data.ax, Math.sqrt(data.ay * data.ay + data.az * data.az)) * 180 / Math.PI;
                    const roll = Math.atan2(data.ay, data.az) * 180 / Math.PI;
                    document.getElementById('pitch').innerText = pitch.toFixed(1);
                    document.getElementById('roll').innerText = roll.toFixed(1);
                    
                    const dLabel = document.getElementById('danger');
                    dLabel.innerText = data.danger ? "EMERGENCY STOP" : "SAFE";
                    dLabel.className = data.danger ? "danger" : "";
                } else if (topic === 'rover/scan' && data.valid) {
                    // Polar to Cartesian relative to rover (facing up)
                    // Servo 90 is forward. Angle < 90 is right, > 90 is left.
                    const theta = ((data.angle_deg - 90) * Math.PI) / 180;
                    const lateral = data.distance_mm * Math.cos(theta); // x
                    const forward = data.distance_mm * Math.sin(theta); // y
                    
                    // Map to canvas (origin at 200, 380)
                    const canvasX = 200 - (lateral * SCALE);
                    const canvasY = 380 - (forward * SCALE);
                    
                    scanPoints.push({ x: canvasX, y: canvasY, ts: Date.now() });
                    if (scanPoints.length > MAX_POINTS) scanPoints.shift();
                }
            } catch (e) { console.error(e); }
        });

        // Web Serial for direct Gateway control
        let port;
        let writer;
        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                writer = port.writable.getWriter();
                document.getElementById('serialBtn').innerText = 'Serial Connected';
                document.getElementById('serialBtn').style.background = '#009900';
            } catch (e) {
                console.error('Serial connection failed', e);
            }
        }
        
        async function sendCmd(l, r) {
            if (writer) {
                const cmd = `L:${l} R:${r}\n`;
                await writer.write(new TextEncoder().encode(cmd));
            }
        }
    </script>
</body>
</html>
