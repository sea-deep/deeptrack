<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DEEPTRACK — Mine Rescue Rover Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  :root{
    --bg:#0c1210;
    --panel:#131a17;
    --panel-2:#0f1512;
    --line:#25332c;
    --line-soft:#1a231e;
    --text:#e7ece8;
    --text-dim:#8ea295;
    --amber:#e8a33d;
    --amber-dim:#6b5527;
    --green:#4cc27a;
    --green-dim:#204d34;
    --red:#e0554a;
    --red-dim:#5c221d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Bebas Neue',sans-serif;letter-spacing:0.06em;}

  .wrap{display:flex;flex-direction:column;height:100vh;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#141c19,#0f1512);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{width:12px;height:12px;background:var(--amber);
    box-shadow:0 0 10px var(--amber);transform:rotate(45deg);}
  .brand h1{font-size:26px;margin:0;color:var(--text);}
  .brand small{display:block;font-size:11px;color:var(--text-dim);
    letter-spacing:0.12em;text-transform:uppercase;margin-top:-4px;}

  .conn{display:flex;align-items:center;gap:14px;}
  .btn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    letter-spacing:0.05em;text-transform:uppercase;color:var(--text);
    background:var(--panel-2);border:1px solid var(--line);padding:9px 16px;
    cursor:pointer;transition:border-color .15s,color .15s;
  }
  .btn:hover{border-color:var(--amber);color:var(--amber);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn.danger-btn:hover{border-color:var(--red);color:var(--red);}
  .btn.mqtt-btn{border-color:var(--amber-dim);}
  .btn.mqtt-btn:hover{border-color:var(--amber);color:var(--amber);}
  .btn.gw-btn{border-color:var(--green-dim);}
  .btn.gw-btn:hover{border-color:var(--green);color:var(--green);}

  .pill{display:flex;align-items:center;gap:7px;font-size:11px;
    text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);}
  .dot.live{background:var(--green);box-shadow:0 0 8px var(--green);}
  .dot.off{background:#4a4a4a;}

  main{flex:1;display:grid;grid-template-columns:1fr 320px;gap:1px;
    background:var(--line);overflow:hidden;}

  .map-panel{background:var(--panel);position:relative;display:flex;flex-direction:column;}
  .map-head{display:flex;justify-content:space-between;align-items:baseline;
    padding:14px 18px 0 18px;}
  .map-head h2{font-size:22px;margin:0;color:var(--amber);}
  .map-head span{font-size:11px;color:var(--text-dim);}
  #mapCanvas{flex:1;width:100%;display:block;}

  .state-badge{
    position:absolute;top:16px;right:18px;padding:6px 14px;
    font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
    border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);
  }
  .state-badge.NORMAL{color:var(--green);border-color:var(--green-dim);}
  .state-badge.SLOW{color:var(--amber);border-color:var(--amber-dim);}
  .state-badge.AVOIDING{color:var(--amber);border-color:var(--amber-dim);background:#241c0d;}
  .state-badge.DANGER{color:var(--red);border-color:var(--red);background:#2a1210;
    animation:pulse 0.9s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(224,85,74,0);}50%{box-shadow:0 0 14px rgba(224,85,74,0.55);}}

  .side{background:var(--panel);display:flex;flex-direction:column;overflow-y:auto;}
  .sec{padding:16px 18px;border-bottom:1px solid var(--line-soft);}
  .sec h3{margin:0 0 12px 0;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--text-dim);font-weight:600;}

  .indicators{display:flex;gap:10px;}
  .led{flex:1;text-align:center;padding:10px 0;border:1px solid var(--line);background:var(--panel-2);}
  .led .lamp{width:16px;height:16px;border-radius:50%;margin:0 auto 8px auto;
    background:#2a332e;}
  .led.on-red .lamp{background:var(--red);box-shadow:0 0 12px var(--red);}
  .led.on-green .lamp{background:var(--green);box-shadow:0 0 12px var(--green);}
  .led label{font-size:10px;letter-spacing:0.08em;color:var(--text-dim);text-transform:uppercase;}
  .buzz{margin-top:10px;text-align:center;font-size:11px;letter-spacing:0.1em;
    color:var(--text-dim);padding:8px;border:1px dashed var(--line);}
  .buzz.active{color:var(--red);border-color:var(--red);animation:pulse 0.6s infinite;}

  .gauge{margin-bottom:14px;}
  .gauge:last-child{margin-bottom:0;}
  .gauge-top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px;}
  .gauge-top .name{color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;}
  .gauge-top .val{color:var(--text);font-weight:600;}
  .gauge-top .val.hot{color:var(--red);}
  .bar{position:relative;height:8px;background:var(--panel-2);border:1px solid var(--line);}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--green);transition:width .25s;}
  .bar .fill.hot{background:var(--red);}
  .bar .thresh{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--amber);}

  .stat-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;
    border-bottom:1px solid var(--line-soft);color:var(--text-dim);}
  .stat-row b{color:var(--text);font-weight:600;}

  .log{flex:1;overflow-y:auto;padding:10px 18px;font-size:11px;}
  .log-entry{padding:5px 0;border-bottom:1px solid var(--line-soft);color:var(--text-dim);}
  .log-entry b{color:var(--red);}
  .log-entry.info b{color:var(--amber);}

  .empty-hint{color:var(--text-dim);font-size:12px;text-align:center;
    margin-top:40px;line-height:1.6;}
  .empty-hint code{color:var(--amber);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1 class="display">DEEPTRACK</h1>
        <small>Mine Rescue Rover — Live Console</small>
      </div>
    </div>
    <div class="conn">
      <div class="pill"><span class="dot off" id="connDot"></span><span id="connLabel">Offline</span></div>
      <button class="btn mqtt-btn" id="mqttBtn">Connect MQTT</button>
      <button class="btn gw-btn" id="connectBtn">Connect Serial</button>
      <button class="btn" id="demoBtn">Demo Mode</button>
      <button class="btn danger-btn" id="resetBtn">Reset Path</button>
    </div>
  </header>

  <main>
    <div class="map-panel">
      <div class="map-head">
        <h2 class="display">Path Trace</h2>
        <span id="mapSubtitle">dead-reckoned · cm</span>
      </div>
      <div class="state-badge NORMAL" id="stateBadge">—</div>
      <canvas id="mapCanvas"></canvas>
    </div>

    <div class="side">
      <div class="sec">
        <h3>Status</h3>
        <div class="indicators">
          <div class="led on-green" id="ledGreen"><div class="lamp"></div><label>Normal</label></div>
          <div class="led" id="ledRed"><div class="lamp"></div><label>Danger</label></div>
        </div>
        <div class="buzz" id="buzzBox">Buzzer silent</div>
      </div>

      <div class="sec">
        <h3>Environment</h3>
        <div class="gauge"><div class="gauge-top"><span class="name">Temperature</span><span class="val" id="v-temp">— °C</span></div>
          <div class="bar"><div class="fill" id="b-temp"></div><div class="thresh" style="left:83%"></div></div></div>
        <div class="gauge"><div class="gauge-top"><span class="name">Humidity</span><span class="val" id="v-hum">— %</span></div>
          <div class="bar"><div class="fill" id="b-hum"></div><div class="thresh" style="left:85%"></div></div></div>
        <div class="gauge"><div class="gauge-top"><span class="name">Methane / CH4 (MQ-4)</span><span class="val" id="v-gas">—</span></div>
          <div class="bar"><div class="fill" id="b-gas"></div><div class="thresh" style="left:44%"></div></div></div>
        <div class="gauge"><div class="gauge-top"><span class="name">Water</span><span class="val" id="v-water">—</span></div>
          <div class="bar"><div class="fill" id="b-water"></div><div class="thresh" style="left:61%"></div></div></div>
        <div class="gauge"><div class="gauge-top"><span class="name">Tilt</span><span class="val" id="v-tilt">— °</span></div>
          <div class="bar"><div class="fill" id="b-tilt"></div><div class="thresh" style="left:67%"></div></div></div>
      </div>

      <div class="sec">
        <h3>Navigation</h3>
        <div class="stat-row"><span>Front distance</span><b id="s-front">—</b></div>
        <div class="stat-row"><span>Position (x, y)</span><b id="s-pos">—</b></div>
        <div class="stat-row"><span>Heading</span><b id="s-heading">—</b></div>
        <div class="stat-row"><span>Encoders L / R</span><b id="s-enc">—</b></div>
        <div class="stat-row"><span>Distance traveled</span><b id="s-dist">0 cm</b></div>
      </div>

      <div class="sec" style="flex:1;display:flex;flex-direction:column;min-height:120px;">
        <h3>Event Log</h3>
        <div class="log" id="logBox"></div>
      </div>
    </div>
  </main>
</div>

<script>
const THRESH = { temp: 50, hum: 85, gas: 1800, water: 2500, tilt: 40 };
const MAXV   = { temp: 60, hum: 100, gas: 4095, water: 4095, tilt: 60 };

// State → path color mapping
const STATE_COLORS = {
  NORMAL:   '#4cc27a',
  SLOW:     '#e8a33d',
  AVOIDING: '#d4912e',
  DANGER:   '#e0554a'
};

let port, reader, keepReading = false;
let trail = [];       // {x, y, heading, state, danger}
let hazards = [];     // {x, y, cause}
let latest = null;
let wasDanger = false;
let totalDistCm = 0;  // cumulative distance

const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas(){
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height - 46;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function log(msg, cls=''){
  const box = document.getElementById('logBox');
  const t = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = 'log-entry ' + cls;
  div.innerHTML = `<b>${t}</b> — ${msg}`;
  box.prepend(div);
  while(box.children.length > 60) box.removeChild(box.lastChild);
}

function setGauge(key, value, unit, decimals=0){
  const pct = Math.max(0, Math.min(100, (value / MAXV[key]) * 100));
  const hot = value >= THRESH[key];
  document.getElementById('v-'+key).textContent = value.toFixed(decimals) + ' ' + unit;
  document.getElementById('v-'+key).classList.toggle('hot', hot);
  const fill = document.getElementById('b-'+key);
  fill.style.width = pct + '%';
  fill.classList.toggle('hot', hot);
}


const scanPoints = []; 
const MAX_POINTS = 200;
const SCALE = 0.25; 

function handleScan(data) {
    if (data.valid) {
        const theta = ((data.angle_deg - 90) * Math.PI) / 180;
        const lateral = data.distance_mm * Math.cos(theta); 
        const forward = data.distance_mm * Math.sin(theta); 
        const w = canvas.width;
        const h = canvas.height;
        const canvasX = (w / 2) - (lateral * SCALE);
        const canvasY = (h - 20) - (forward * SCALE);
        scanPoints.push({ x: canvasX, y: canvasY, ts: Date.now() });
        if (scanPoints.length > MAX_POINTS) scanPoints.shift();
    }
}

function drawMap() {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#0f1512';
    ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = '#25332c';
    ctx.beginPath();
    ctx.arc(w/2, h-20, 100, 0, Math.PI, true);
    ctx.arc(w/2, h-20, 200, 0, Math.PI, true);
    ctx.stroke();
    ctx.fillStyle = '#4cc27a';
    ctx.fillRect(w/2 - 5, h-25, 10, 10);
    const now = Date.now();
    for (let i = scanPoints.length - 1; i >= 0; i--) {
        const pt = scanPoints[i];
        const age = now - pt.ts;
        if (age > 5000) { scanPoints.splice(i, 1); continue; }
        const alpha = 1.0 - (age / 5000);
        ctx.fillStyle = `rgba(0, 255, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    requestAnimationFrame(drawMap);
}

drawMap();
</script>
</body>
</html>
